services:
  - type: web
    name: careerconnect-sockets
    runtime: node
    plan: starter
    rootDir: sockets
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXTAUTH_SECRET
        sync: false   # must exactly match the value set on the Vercel app
      - key: SOCKET_RELAY_SECRET
        sync: false   # must exactly match the value set on the Vercel app
      - key: APP_ORIGIN
        value: https://REPLACE-WITH-YOUR-VERCEL-DOMAIN.vercel.app
